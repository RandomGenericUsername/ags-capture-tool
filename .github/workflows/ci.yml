name: ci

# Stock-runner CI only (AD-19/AD-23): pure tests, manifest/handler/template
# conformance and the Python backend pytest suite. Typecheck and bundle are
# LOCAL gates; do not add a self-hosted job.
#
# The program tuple is `ags-platform` v1.1.0 (Generations v3 appearance plane,
# required `surface.window` role + `opacity` token kind) /
# `contracts` v0.12.0 (same required window group). Locally those tags are
# symlinked under `.dev/`; CI checks out the exact tags explicitly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      CONTRACTS_ROOT: ${{ github.workspace }}/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v4
        with:
          repository: RandomGenericUsername/ags-platform
          ref: v1.1.0
          path: .dev/ags-platform/v1.1.0
      - uses: actions/checkout@v4
        with:
          repository: RandomGenericUsername/contracts
          ref: v0.12.0
          path: contracts
      - run: make ci
